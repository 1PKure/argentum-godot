# Run from this directory, using a private .env owned by the server administrator.
services:
  arena:
    build:
      context: ../..
      dockerfile: hosting/Dockerfile
    image: ao-mini-pilot:${AO_SOURCE_SHA:?Set the exact deployed Git commit}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "10000"
      AO_PUBLIC_ACCESS: "false"
      AO_CAPACITY: "8"
      AO_VERIFY_PUBLIC_WSS: "false"
      AO_ALLOWED_ORIGINS: https://argentum-arena-mati.smartpine8.chatgpt.site
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:10000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks: [pilot]
  tls:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      AO_HOST: ${AO_HOST:?Set the pilot hostname}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls_data:/data
      - tls_config:/config
    depends_on:
      arena:
        condition: service_healthy
    mem_limit: 96m
    networks: [pilot]
networks:
  pilot: {}
volumes:
  tls_data: {}
  tls_config: {}
